plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'game'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src/game']
        }
    }
    test {
        java {
            srcDirs = ['src/tests']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.1'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'game.Main'
    }
}

// Fat JAR for the VK bot entry point (game.VkBotMain).
tasks.register('vkJar', Jar) {
    archiveClassifier = 'vk'
    manifest {
        attributes 'Main-Class': 'game.VkBotMain'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/9/module-info.class'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
